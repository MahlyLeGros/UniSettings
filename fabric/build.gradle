plugins {
    id 'multiloader-loader'
}

// Minecraft 1.14.4 à 1.21.11 : le code du jeu est obfusqué, Loom doit renommer ("remap") le mod.
// Minecraft 26.1 et plus : plus d'obfuscation, donc plus de renommage (voir build.gradle à la racine).
apply plugin: (unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap')

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    } else {
        // Les noms officiels de Mojang (Parchment n'ajoute que des noms de paramètres, inutiles ici
        // et absents des vieilles versions).
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
