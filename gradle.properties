# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=0.2.0
group=io.github.mahlylegros.unisettings
# JDK utilisé pour compiler (Minecraft 26.x a besoin de Java 25). Le jar, lui, vise Java 8 ou 21
# selon la famille de versions (voir build.gradle à la racine).
java_version=25

# Common
## Version de Minecraft compilée par défaut (./gradlew build). On peut en choisir une autre
## avec -Pmc=<version>, par exemple ./gradlew build -Pmc=1.20.1
minecraft_version=1.21.11
mod_name=UniSettings
mod_author=MahlyLeGros
mod_id=unisettings
license=MIT
credits=
description=Garde les mêmes réglages Minecraft dans toutes tes instances.

## Famille 1 : Minecraft 1.14.4 à 1.21.11, un seul jar (Java 8)
mc1_label=1.14.4-1.21.11
mc1_range=>=1.14.4 <=1.21.11
mc1_fabric_loader_min=0.14.0
## Famille 2 : Minecraft 26.1 et plus, un seul jar (Java 21)
mc26_label=26.x
mc26_range=>=26.1
mc26_fabric_loader_min=0.18.0

## Le module common se compile contre Minecraft 1.21.1 (juste pour vérifier le code commun) ;
## le module fabric recompile ce même code contre chaque version visée.
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
loom_version=1.19-SNAPSHOT
fabric_loader_version=0.20.1

# Forge
forge_version=52.0.28
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
