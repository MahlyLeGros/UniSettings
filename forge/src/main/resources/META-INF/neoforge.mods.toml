# Lu par NeoForge 1.20.5 et plus (jusqu'à 26.x).
modLoader="javafml"
loaderVersion="[1,)"
license="${license}"
issueTrackerURL="https://github.com/MahlyLeGros/UniSettings/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description='''${description}'''
# Le mod ne concerne que le client : un serveur peut l'avoir ou pas, ça ne change rien.
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="${mod_id}.forge.mixins.json"
