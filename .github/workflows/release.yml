name: Release

# Lancée à la main (onglet Actions > Release > Run workflow) : fabrique les deux jars à partir
# de la branche choisie, puis publie la release v<version> (version lue dans gradle.properties)
# avec les jars en pièces jointes.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Notes de version (Markdown)
        required: false
        default: ''

permissions:
  contents: write

env:
  JAVA_VERSION: 25

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Mêmes étapes que build.yml (2e essai si un dépôt Maven a un raté réseau)
      - run: ./gradlew build || ./gradlew build
      - run: ./gradlew :fabric:build -Pmc=26.1 || ./gradlew :fabric:build -Pmc=26.1
      - run: ./gradlew universalJar
      - name: Rassembler les jars
        id: jars
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp build/libs/*.jar dist/
          ls forge/build/libs/*.jar | grep -v -e sources -e javadoc | xargs -I{} cp {} dist/
          ls -l dist
          test "$(ls dist | wc -l)" -eq 3
      - name: Notes de version
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s\n' "$NOTES" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.jars.outputs.version }}
          name: UniSettings ${{ steps.jars.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*.jar
          fail_on_unmatched_files: true
