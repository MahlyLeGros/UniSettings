name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Java 25 : il en faut au moins 25 pour compiler contre Minecraft 26.x.
env:
  JAVA_VERSION: 25

jobs:
  versions:
    name: Liste des versions de Minecraft
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.list.outputs.all }}
      smoke: ${{ steps.list.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: python3 .github/scripts/mc_versions.py

  jars:
    name: Jars du mod + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Jar 1 : Minecraft 1.14.4 à 1.21.11 (plus tests du code commun)
      - run: ./gradlew build
      # Jar 2 : Minecraft 26.1 et plus
      - run: ./gradlew :fabric:build -Pmc=26.1
      - uses: actions/upload-artifact@v4
        with:
          name: unisettings-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar

  compile:
    name: Compile ${{ matrix.mc }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: chmod +x gradlew
      - run: ./gradlew :fabric:assemble -Pmc=${{ matrix.mc }} -x javadoc
      # Pour 1.14.4 à 1.21.11 : la "refmap" dit à Fabric quels noms internes viser.
      # Si elle est identique pour toutes ces versions, le même jar marche partout.
      - name: Extraire la refmap
        if: startsWith(matrix.mc, '1.')
        run: |
          mkdir -p refmap
          jar=$(ls fabric/build/libs/*.jar | grep -v -e sources -e javadoc | head -1)
          unzip -p "$jar" unisettings.refmap.json | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin), indent=2, sort_keys=True))' > "refmap/${{ matrix.mc }}.json"
          cat "refmap/${{ matrix.mc }}.json"
      - if: startsWith(matrix.mc, '1.')
        uses: actions/upload-artifact@v4
        with:
          name: refmap-${{ matrix.mc }}
          path: refmap/

  same-jar:
    name: Un seul jar pour 1.14.4 à 1.21.11 ?
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: refmap-*
          path: refmap
          merge-multiple: true
      - run: |
          ls refmap
          ref=refmap/1.21.11.json
          grep -q "field_" "$ref" && grep -q "method_" "$ref" || { echo "Refmap incomplète"; cat "$ref"; exit 1; }
          status=0
          for f in refmap/*.json; do
            if ! diff -u "$ref" "$f"; then
              echo "::error::$(basename "$f" .json) a une refmap différente de 1.21.11"
              status=1
            fi
          done
          exit $status

  smoke:
    name: Lancement réel ${{ matrix.mc }}
    needs: [versions, jars]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unisettings-fabric
          path: jars
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri
      - run: pip install "portablemc>=4.4,<5"
      - name: Lancer Minecraft ${{ matrix.mc }}
        run: |
          if [[ "${{ matrix.mc }}" == 1.* ]]; then pattern='1.14.4-1.21.11'; else pattern='26.x'; fi
          jar=$(ls jars/*.jar | grep -- "$pattern" | head -1)
          echo "Jar testé : $jar"
          .github/scripts/smoke_test.sh "${{ matrix.mc }}" "$jar"
